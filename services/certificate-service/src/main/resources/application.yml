server:
  port: ${CERTIFICATE_SERVICE_PORT:8086}

spring:
  application:
    name: certificate-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:alumni_portal_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

certificate:
  storage:
    path: ${CERTIFICATE_STORAGE_PATH:./uploads/certificates}
  baseUrl: ${PORTAL_BASE_URL:https://portal.nsbm.ac.lk}