server:
  port: ${CERTIFICATE_SERVICE_PORT:8086}

spring:
  application:
    name: certificate-service

  datasource:
    url: ${DB_URL:jdbc:h2:mem:certificate_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  storage:
    pdf-dir: ${STORAGE_PDF_DIR:./storage/certificates}
    template-dir: ${STORAGE_TEMPLATE_DIR:./storage/templates}
  verification:
    base-url: ${VERIFICATION_BASE_URL:http://localhost:8086/api/v1/certificates/verify/}
