name: Audit And Storage Service Pipeline

on:
  push:
    branches: ["audit_storage_service"]
    paths:
      - "services/audit-storage-service/**"
      - "pom.xml"
  pull_request:
    branches: ["main"]
    paths:
      - "services/audit-storage-service/**"
      - "pom.xml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Clone Repository
        uses: actions/checkout@v7

      - name: Install JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Give Permissions to Maven in ubuntu
        run: chmod +x mvnw

      #      to see what files are in the project folder
      - name: see files
        run: ls -la

      - name: Build & Test Audit And Storage Service
        run: ./mvnw clean test -pl services/audit-storage-service -am

      - name: Package Audit And Storage Service
        run: ./mvnw package -DskipTests -pl services/audit-storage-service -am

      - name: Upload Audit And Storage Service Artifact
        uses: actions/upload-artifact@v4
        with:
          name: audit-storage-service-jar
          path: services/audit-storage-service/target/*.jar
