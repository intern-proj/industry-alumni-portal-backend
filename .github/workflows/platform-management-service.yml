name: Platform Management Service Pipeline

on:
  push:
    branches: ["platform-management-service"]
    paths:
      - "services/platform-management-service/**"
      - "pom.xml"
  pull_request:
    branches: ["main"]
    paths:
      - "services/platform-management-service/**"
      - "pom.xml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Clone Repository
        uses: actions/checkout@v7

      - name: Install JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Give Permissions to Maven in ubuntu
        run: chmod +x mvnw

      #      to see what files are in the project folder
      - name: see files
        run: ls -la

      - name: Build & Test Platform Management Service
        run: ./mvnw clean test -pl services/platform-management-service -am

      - name: Package Platform Management Service
        run: ./mvnw package -DskipTests -pl services/platform-management-service -am

      - name: Upload Platform Management Service Artifact
        uses: actions/upload-artifact@v4
        with:
          name: platform-management-service-jar
          path: services/platform-management-service/target/*.jar
