server:
  port: 8080

api:
  path: /api/v1

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            allowCredentials: true
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      discovery:
        locator:
          enabled: false
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=${api.path}/auth/**

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=${api.path}/templates/**

        - id: event-management-service
          uri: lb://event-management-service
          predicates:
            - Path=${api.path}/events/**,${api.path}/venues/**,${api.path}/speakers/**,${api.path}/guest-speakers/**,${api.path}/agendas/**

        - id: event-participation-service
          uri: lb://event-participation-service
          predicates:
            - Path=${api.path}/registrations/**,${api.path}/qr-sessions/**

        - id: application-service
          uri: lb://application-service
          predicates:
            - Path=${api.path}/applications/**

        - id: audit-storage-service
          uri: lb://audit-storage-service
          predicates:
            - Path=${api.path}/storage/**,${api.path}/audit/**

        # Swagger / OpenAPI Documentation Aggregation Routes
        - id: auth-service-docs
          uri: lb://auth-service
          predicates:
            - Path=/services-docs/auth-service
          filters:
            - SetPath=/v3/api-docs

        - id: event-management-service-docs
          uri: lb://event-management-service
          predicates:
            - Path=/services-docs/event-management-service
          filters:
            - SetPath=/v3/api-docs

        - id: event-participation-service-docs
          uri: lb://event-participation-service
          predicates:
            - Path=/services-docs/event-participation-service
          filters:
            - SetPath=/v3/api-docs

        - id: application-service-docs
          uri: lb://application-service
          predicates:
            - Path=/services-docs/application-service
          filters:
            - SetPath=/v3/api-docs

        - id: notification-service-docs
          uri: lb://notification-service
          predicates:
            - Path=/services-docs/notification-service
          filters:
            - SetPath=/v3/api-docs

        - id: audit-storage-service-docs
          uri: lb://audit-storage-service
          predicates:
            - Path=/services-docs/audit-storage-service
          filters:
            - SetPath=/v3/api-docs

        - id: platform-management-service
          uri: lb://platform-management-service
          predicates:
            - Path=${api.path}/partner-verifications/**,${api.path}/vacancy-approvals/**,${api.path}/admin/partner-verifications/**,${api.path}/admin/vacancy-approvals/**,${api.path}/internal/partner-verifications/**,${api.path}/internal/vacancy-approvals/**,${api.path}/partners/**,${api.path}/vacancies/**

        - id: platform-management-service-docs
          uri: lb://platform-management-service
          predicates:
            - Path=/services-docs/platform-management-service
          filters:
            - SetPath=/v3/api-docs

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Auth Service
        url: /services-docs/auth-service
      - name: Event Management Service
        url: /services-docs/event-management-service
      - name: Event Participation Service
        url: /services-docs/event-participation-service
      - name: Application Service
        url: /services-docs/application-service
      - name: Notification Service
        url: /services-docs/notification-service
      - name: Audit & Storage Service
        url: /services-docs/audit-storage-service
      - name: Platform Management Service
        url: /services-docs/platform-management-service

management:
  endpoint:
    gateway:
      enabled: true
    health:
      show-details: always
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include:
          - info
          - health
          - gateway
          - metrics

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}